<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CodeLine HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Sora:wght@300;600;700&display=swap">
<style>
/* Layout: graphite brand band (logo, live dot, tabs) over a chalk work surface; each tab is one scannable panel set. */
:root{
  --bg:#F3F2EE; --panel:#FBFAF7; --panel-2:#ECEBE6; --fg:#16181D; --muted:#5B606B;
  --line:rgba(22,24,29,.12); --line-strong:rgba(22,24,29,.22);
  --accent:#2747FF; --btn:#2747FF; --btn-fg:#FFFFFF; --accent-soft:rgba(39,71,255,.10);
  --ok:#1E7A50; --ok-soft:rgba(30,122,80,.12); --warn:#8F5B00; --warn-soft:rgba(183,121,31,.16);
  --bad:#B4362A; --bad-soft:rgba(180,54,42,.12);
  --band:#16181D; --band-fg:#F3F2EE; --band-muted:#9AA0AB; --band-line:rgba(243,242,238,.14);
  --shadow:0 18px 50px rgba(22,24,29,.18);
  --font-display:'Sora', 'Segoe UI', system-ui, sans-serif;
  --font-body:'DM Sans', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121418; --panel:#1B1E24; --panel-2:#252930; --fg:#F3F2EE; --muted:#9AA0AB;
  --line:rgba(243,242,238,.11); --line-strong:rgba(243,242,238,.22);
  --accent:#8C9DFF; --accent-soft:rgba(140,157,255,.14);
  --ok:#5BC994; --ok-soft:rgba(91,201,148,.14); --warn:#E5B25A; --warn-soft:rgba(229,178,90,.15);
  --bad:#F08A7E; --bad-soft:rgba(240,138,126,.14);
  --band:#0C0D10; --band-line:rgba(243,242,238,.10); --shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121418; --panel:#1B1E24; --panel-2:#252930; --fg:#F3F2EE; --muted:#9AA0AB;
  --line:rgba(243,242,238,.11); --line-strong:rgba(243,242,238,.22);
  --accent:#8C9DFF; --accent-soft:rgba(140,157,255,.14);
  --ok:#5BC994; --ok-soft:rgba(91,201,148,.14); --warn:#E5B25A; --warn-soft:rgba(229,178,90,.15);
  --bad:#F08A7E; --bad-soft:rgba(240,138,126,.14);
  --band:#0C0D10; --band-line:rgba(243,242,238,.10); --shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
@media (max-width:560px){.wrap{padding-inline:16px}}

/* Band */
.band{background:var(--band);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.band-top{display:flex;align-items:center;gap:14px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand-name span{font-weight:300;color:var(--band-muted)}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--band-muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--band-muted)}
.sync.live i{background:#2747FF;box-shadow:0 0 0 0 rgba(39,71,255,.7);animation:pulse 2.4s infinite}
.sync.off i{background:#F08A7E}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,71,255,.65)}70%{box-shadow:0 0 0 8px rgba(39,71,255,0)}100%{box-shadow:0 0 0 0 rgba(39,71,255,0)}}
@media (prefers-reduced-motion:reduce){.sync.live i{animation:none}}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--band-muted);padding:10px 12px 12px;font-weight:500;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--band-fg)}
.tab[aria-selected="true"]{color:var(--band-fg);border-bottom-color:#2747FF}
.tab .count{font-size:11.5px;background:var(--band-line);border-radius:99px;padding:1px 7px;color:var(--band-fg)}
.tab .count.hot{background:#2747FF}

main{padding-block:26px 64px}
.banner{background:var(--warn-soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:14px}

h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(22px,3vw,28px);font-weight:600}
h2{font-size:16px;font-weight:600}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
a.btn{text-decoration:none;color:inherit}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel-head a,.linkish{color:var(--accent);font-size:13px;font-weight:500;text-decoration:none;background:none;border:0;cursor:pointer;padding:0}

/* Overview */
.ov-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,2fr);gap:16px}
@media (max-width:900px){.ov-grid{grid-template-columns:minmax(0,1fr)}}
.outreach{background:var(--band);color:var(--band-fg);border-color:transparent;display:flex;flex-direction:column;gap:14px}
.outreach .eyebrow{color:var(--band-muted)}
.or-main{display:flex;align-items:center;gap:16px}
.or-num{font-family:var(--font-display);font-weight:300;font-size:64px;line-height:1;letter-spacing:-.04em}
.or-num b{font-weight:700}
.or-num small{font-size:24px;color:var(--band-muted);font-weight:300}
.or-btns{margin-left:auto;display:flex;gap:8px}
.or-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--band-line);background:transparent;color:var(--band-fg);font-size:22px;cursor:pointer;display:grid;place-items:center}
.or-btn.plus{background:#2747FF;border-color:#2747FF;color:#fff}
.or-btn:hover{filter:brightness(1.15)}
.or-line{height:4px;border-radius:4px;background:var(--band-line);position:relative;overflow:hidden}
.or-line i{position:absolute;inset:0 auto 0 0;background:#2747FF;border-radius:4px;transition:width .3s}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:64px;position:relative}
.week .bar{background:var(--band-line);border-radius:4px 4px 2px 2px;min-height:3px;position:relative}
.week .bar.hit{background:#2747FF}
.week .bar.today{outline:1px solid var(--band-fg);outline-offset:2px}
.week-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;color:var(--band-muted);text-align:center}
.or-note{font-size:13px;color:var(--band-muted)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px) and (min-width:901px),(max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.founding{margin-top:auto;padding-top:14px;border-top:1px solid var(--band-line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.f-left{font-family:var(--font-display);font-weight:600;font-size:16px;margin-top:2px}
.dots{display:flex;gap:7px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--band-muted)}
.dots i.taken{background:#2747FF;border-color:#2747FF}

.ov-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
@media (max-width:900px){.ov-cols{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0;padding-top:2px}
.item .main{min-width:0;flex:1}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .right{text-align:right;font-size:13px;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:14px 0 6px}
.empty b{color:var(--fg);font-weight:500}

.funnel{display:flex;flex-direction:column;gap:8px}
.f-row{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;align-items:center;gap:10px;font-size:13.5px}
.f-track{height:10px;background:var(--panel-2);border-radius:6px;overflow:hidden}
.f-fill{height:100%;background:var(--accent);border-radius:6px;min-width:0;transition:width .3s}
.f-row.won .f-fill{background:var(--ok)}
.f-row.lost .f-fill{background:var(--line-strong)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;border-radius:99px;padding:2px 10px;white-space:nowrap;background:var(--panel-2);color:var(--fg)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.grey{color:var(--muted)}

/* Toolbar + tables */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line-strong);background:var(--panel);border-radius:10px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .c{opacity:.7;margin-left:4px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .t{font-weight:500}
td .sub{font-size:12.5px;color:var(--muted)}
.nowrap{white-space:nowrap}
.due{color:var(--bad);font-weight:500}
.soon{color:var(--warn);font-weight:500}
tfoot td{font-weight:600;border-top:1px solid var(--line-strong)}

/* Projects */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.proj{display:flex;flex-direction:column;gap:12px;cursor:pointer}
.proj:hover{border-color:var(--line-strong)}
.proj-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.proj h3{font-size:17px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.steps i{height:5px;border-radius:3px;background:var(--panel-2)}
.steps i.on{background:var(--accent)}
.steps i.done{background:var(--ok)}
.step-label{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.money{display:flex;justify-content:space-between;font-size:13.5px}
.paybar{height:6px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.paybar i{display:block;height:100%;background:var(--ok)}
.meta-row{display:flex;gap:8px;flex-wrap:wrap}

/* Content */
.weekgroup{margin-bottom:18px}
.weekgroup h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px;font-family:var(--font-body);letter-spacing:.04em;text-transform:uppercase}
.c-row{display:grid;grid-template-columns:92px 104px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.c-row:first-child{border-top:0}
.c-row:hover{background:var(--accent-soft)}
.c-date{font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:500}
.c-hook{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmt{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;justify-self:start;white-space:nowrap}
.fmt.reel{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
@media (max-width:620px){.c-row{grid-template-columns:72px minmax(0,1fr) auto}.c-row .fmt{display:none}}

/* Website */
.site-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.site-grid{grid-template-columns:minmax(0,1fr)}}
.site-card{display:flex;flex-direction:column;gap:12px}
.url{font-family:var(--font-display);font-size:15px;font-weight:600;word-break:break-all;color:var(--accent);text-decoration:none}
.links{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:18px;height:18px;margin-top:2px;accent-color:#2747FF;flex:none}
.check span{flex:1;min-width:0}
.check.done span{color:var(--muted);text-decoration:line-through}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;min-width:0;border:1px solid var(--line-strong);background:var(--bg);border-radius:10px;padding:8px 12px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(12,13,16,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--panel);width:min(480px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:500;color:var(--muted)}
.field input:not([type=checkbox]),.field select,.field textarea{border:1px solid var(--line-strong);background:var(--bg);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.field.checkbox{flex-direction:row;align-items:center;gap:8px}
.field.checkbox input{width:18px;height:18px;accent-color:#2747FF}
.field .hint{font-size:12px;color:var(--muted)}
@media (max-width:460px){.form{grid-template-columns:1fr}}
.drawer-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.drawer-foot .spacer{flex:1}
.err{color:var(--bad);font-size:13px}
.callout{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.mini-table{font-size:13px}
.mini-table td{padding:6px 0;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow)}

/* Website editor */
.cms-group{margin-bottom:16px}
.cms-field{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.cms-field:nth-child(2){border-top:0}
.cms-field label{font-size:13px;color:var(--muted);font-weight:500;padding-top:8px}
.cms-field textarea,.cms-field input{border:1px solid var(--line-strong);background:var(--bg);border-radius:9px;padding:8px 10px;width:100%;min-width:0;resize:vertical}
.cms-field.dirty textarea,.cms-field.dirty input{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.img-field{display:flex;gap:12px;align-items:flex-start;min-width:0}
.img-field .thumb{width:104px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);flex:none}
@media (max-width:620px){.cms-field{grid-template-columns:minmax(0,1fr);gap:4px}.cms-field label{padding-top:0}.img-field .thumb{width:72px;height:56px}}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:flex-end;gap:14px;background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:var(--shadow);margin-top:8px;z-index:5}
.drawer-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Document studio: form beside a live A4 preview */
.studio{position:fixed;inset:0;z-index:55;background:var(--bg);display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr)}
.studio-side{overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;background:var(--panel);padding-top:calc(20px + env(safe-area-inset-top,0px))}
.studio-prev{overflow:auto;padding:20px;background:var(--panel-2)}
.studio-page{margin:0 auto;width:794px;box-shadow:0 10px 40px rgba(22,24,29,.25)}
@media (max-width:860px){.studio{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;overflow-y:auto}.studio-side{overflow:visible;border-right:0}.studio-prev{overflow:visible;padding:16px}}
.items{display:flex;flex-direction:column;gap:6px}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 54px 92px 30px;gap:6px;align-items:center}
.item-row.head span{font-size:12px;color:var(--muted);font-weight:500}
.item-row input{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:7px 8px;min-width:0;width:100%}

/* A4 documents: always printed light, in brand colours */
.cl-doc{width:794px;min-height:1122px;background:#fff;color:#16181D;font-family:'DM Sans',system-ui,sans-serif;font-size:13.5px;line-height:1.55;padding:60px 66px 54px;display:flex;flex-direction:column;box-sizing:border-box;position:relative;-webkit-font-smoothing:antialiased}
.cl-doc *{box-sizing:border-box}
.cl-doc .muted{color:#5B606B}
.cl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:22px;border-bottom:2px solid #16181D;margin-bottom:34px}
.cl-logo{display:flex;align-items:center;gap:12px}
.cl-logo img{width:46px;height:46px}
.cl-word{font-family:'Sora',sans-serif;font-size:24px;font-weight:300;letter-spacing:-.01em;line-height:1}
.cl-word b{font-weight:700}
.cl-tag{font-size:10px;color:#5B606B;letter-spacing:.32em;text-transform:uppercase;margin-top:5px}
.cl-contact{text-align:right;font-size:11.5px;color:#5B606B;line-height:1.65}
.cl-main{flex:1}
.cl-title{font-family:'Sora',sans-serif;font-weight:700;font-size:32px;letter-spacing:-.025em;line-height:1.1;margin:0 0 22px}
.cl-h2{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em;margin:26px 0 10px}
.cl-eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5B606B;font-weight:500;margin-bottom:6px}
.cl-strong{font-weight:700;font-family:'Sora',sans-serif;font-size:15px}
.cl-grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:8px}
.cl-grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:24px;margin:8px 0 26px}
.cl-kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid #ECEBE6}
.cl-kv span{color:#5B606B}
.cl-kv b{font-weight:500;text-align:right}
.cl-note{background:#F3F2EE;border-left:4px solid #2747FF;padding:14px 18px;margin:18px 0 6px;white-space:pre-line;border-radius:0 8px 8px 0}
.cl-list{list-style:none;margin:0;padding:0;columns:2;column-gap:28px}
.cl-list li{position:relative;padding:5px 0 5px 18px;break-inside:avoid}
.cl-list li::before{content:"";position:absolute;left:0;top:12px;width:7px;height:7px;border-radius:50%;background:#2747FF}
.cl-table{width:100%;border-collapse:collapse;margin:4px 0 14px;font-size:13px}
.cl-table th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#5B606B;font-weight:500;padding:9px 8px;border-bottom:2px solid #16181D}
.cl-table td{padding:11px 8px;border-bottom:1px solid #D9D8D3;vertical-align:top}
.cl-table th:first-child,.cl-table td:first-child{padding-left:0}
.cl-table th:last-child,.cl-table td:last-child{padding-right:0}
.cl-table .r{text-align:right;white-space:nowrap}
.cl-table .cl-total td{border-bottom:0;border-top:2px solid #16181D;font-family:'Sora',sans-serif;font-weight:700;font-size:17px}
.cl-table .cl-total td:last-child{color:#2747FF}
.cl-totals{margin-left:auto;width:300px}
.cl-totals div{display:flex;justify-content:space-between;padding:5px 0}
.cl-totals .strong{border-top:1px solid #D9D8D3;font-weight:700}
.cl-totals .grand{border-top:2px solid #16181D;margin-top:4px;padding-top:10px;font-family:'Sora',sans-serif;font-weight:700;font-size:19px}
.cl-totals .grand span:last-child{color:#2747FF}
.cl-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 6px}
.cl-steps i{height:6px;border-radius:3px;background:#ECEBE6}
.cl-steps i.on{background:#2747FF}
.cl-steps i.done{background:#16181D}
.cl-steplabels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:11px;color:#5B606B}
.cl-steplabels .on{color:#2747FF;font-weight:700}
.cl-pill{display:inline-block;font-size:11px;font-weight:500;padding:2px 9px;border-radius:99px;background:#ECEBE6;color:#16181D}
.cl-pill.paid{background:#E3F1E9;color:#1E7A50}
.cl-pill.late{background:#F7E4E1;color:#B4362A}
.cl-pre{white-space:pre-line}
.cl-body p{margin:0 0 13px}
.cl-sign{margin-top:38px}
.cl-sign .cl-line{width:190px;height:1px;background:#16181D;margin:40px 0 8px}
.cl-sign .n{font-family:'Sora',sans-serif;font-weight:700;font-size:15px}
.cl-letter{padding-top:6px;font-size:14px}
.cl-to{margin-bottom:26px;line-height:1.6}
.cl-date{margin-bottom:22px;color:#5B606B}
.cl-subject{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;margin-bottom:18px}
.cl-invhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:12px}
.cl-invhead .cl-title{margin-bottom:4px}
.cl-due{text-align:right;background:#16181D;color:#F3F2EE;border-radius:12px;padding:14px 18px;min-width:200px}
.cl-due .cl-eyebrow,.cl-due .muted{color:#9AA0AB}
.cl-amount{font-family:'Sora',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.15}
.cl-stamp{position:absolute;top:250px;right:70px;transform:rotate(-12deg);border:3px solid #1E7A50;color:#1E7A50;font-family:'Sora',sans-serif;font-weight:700;font-size:30px;letter-spacing:.12em;text-transform:uppercase;padding:4px 18px;border-radius:10px;opacity:.85}
.cl-foot{margin-top:34px;padding-top:14px;border-top:1px solid #D9D8D3;display:flex;justify-content:space-between;gap:16px;font-size:10.5px;color:#5B606B}
.cl-foot i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2747FF;margin-right:7px;vertical-align:1px}
</style>

<script>
(function(){
'use strict';

/* ---------- constants from the approved CodeLine pricing ---------- */
var LEAD_STATUSES = ['New','Contacted','Replied','Call booked','Proposal sent','Won','Lost'];
var OPEN = ['New','Contacted','Replied','Call booked','Proposal sent'];
var CHANNELS = ['Instagram DM','WhatsApp','Email','LinkedIn','Referral','Website form','In person'];
var CLIENT_TYPES = ['Local business','Startup','Creative / freelancer','Coach / consultant','Other'];
var STAGES = ['Discovery','Proposal','Design','Build','Launch'];
var APPROVALS = ['Not sent yet','Waiting for client','Changes requested','Approved'];
var CONTENT_STATUS = ['Idea','Planned','Designed','Scheduled','Posted'];
var FORMATS = ['Post','Carousel','Reel','Story'];
var METHODS = ['Bank transfer','Wise','PayPal','Cash','Other'];
var DEFAULT_SETTINGS = {
  outreachTarget: 10, foundingSlots: 5, foundingDiscount: 20,
  packages: [
    {name:'Digital ID', price:590, weeks:2},
    {name:'Portfolio', price:850, weeks:3},
    {name:'Brand Launch', price:1990, weeks:5},
    {name:'Monthly social content', price:249, weeks:4, monthly:true},
    {name:'Care plan: Essential', price:39, weeks:4, monthly:true},
    {name:'Care plan: Growth', price:99, weeks:4, monthly:true},
    {name:'Care plan: Partner', price:279, weeks:4, monthly:true},
    {name:'Custom', price:0, weeks:4}
  ],
  siteUrl: 'https://codeline-studio.akgunbalah.workers.dev'
};

/* ---------- state ---------- */
var S = { leads:[], projects:[], payments:[], content:[], requests:[], checklist:[], invoices:[], letters:[], outreach:{}, settings:DEFAULT_SETTINGS };
var mcp = null, downloads = null, settingsExists = false, mcpResolved = false;
var db = null, tab = 'overview', leadFilter = 'Open', leadQuery = '', payFilter = 'Unpaid', contentFilter = 'Upcoming';
var TABS = [['overview','Overview'],['leads','Leads'],['projects','Projects'],['payments','Payments'],['content','Content'],['website','Website'],['docs','Documents']];

/* ---------- helpers ---------- */
function h(tag, attrs){
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'on') for (var ev in v) el.addEventListener(ev, v[ev]);
    else if (k === 'style') el.setAttribute('style', v);
    else if (k in el && typeof v !== 'string') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c){
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function(x){ add(el, x); }); return; }
  el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
}
function pad(n){ return (n < 10 ? '0' : '') + n; }
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function today(){ return iso(new Date()); }
function parse(s){ return s ? new Date(s + 'T00:00:00') : null; }
function addDays(s, n){ var d = parse(s) || new Date(); d.setDate(d.getDate() + n); return iso(d); }
function daysFrom(s){ if (!s) return null; return Math.round((parse(s) - parse(today())) / 86400000); }
var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(s, withDow){ var d = parse(s); if (!d) return '—'; return (withDow === false ? '' : DOW[d.getDay()] + ' ') + d.getDate() + ' ' + MON[d.getMonth()]; }
function rel(s){
  var n = daysFrom(s); if (n == null) return '—';
  if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday';
  if (n < 0) return Math.abs(n) + ' days late'; if (n < 7) return 'In ' + n + ' days';
  return fmtDate(s);
}
function money(n){ n = Number(n) || 0; return '$' + n.toLocaleString('en-US', {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2}); }
function round2(n){ return Math.round(n * 100) / 100; }
function pkg(name){ return (S.settings.packages || []).filter(function(p){ return p.name === name; })[0]; }
function byId(list, id){ return list.filter(function(x){ return x.id === id; })[0]; }
function setTab(t){ tab = t; try { history.replaceState(null, '', '#' + t); } catch(e){} render(); window.scrollTo(0,0); }

function toast(msg){
  var t = h('div', {class:'toast', role:'status'}, msg);
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200);
}
function fail(e){ console.error(e); toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete old records to add new ones.' : 'Couldn’t save. Check your connection and try again.'); }

/* ---------- derived values ---------- */
function projectPrice(p){ var base = Number(p.price) || 0; return p.founding ? round2(base * (1 - (S.settings.foundingDiscount || 20) / 100)) : base; }
function paymentsFor(pid){ return S.payments.filter(function(x){ return x.projectId === pid; }); }
function paidFor(pid){ return paymentsFor(pid).reduce(function(s, x){ return s + (x.paidOn ? Number(x.amount) || 0 : 0); }, 0); }
function payState(x){ if (x.paidOn) return 'Paid'; var n = daysFrom(x.due); if (n != null && n < 0) return 'Overdue'; if (n != null && n <= 3) return 'Due soon'; return 'Due'; }
function payClient(x){ var p = byId(S.projects, x.projectId); return p ? p.client : (x.client || 'No project'); }
function leadDue(l){ return OPEN.indexOf(l.status) >= 0 && l.nextFollowUp && daysFrom(l.nextFollowUp) <= 0; }
function foundingUsed(){ return S.projects.filter(function(p){ return p.founding; }).length; }
function outreachOn(d){ var o = S.outreach[d]; return o ? Number(o.count) || 0 : 0; }

function leadPill(s){
  var cls = s === 'Won' ? 'ok' : s === 'Lost' ? 'grey' : s === 'New' ? '' : s === 'Proposal sent' || s === 'Call booked' ? 'blue' : 'blue';
  return h('span', {class:'pill ' + cls}, s);
}
function payPill(x){ var st = payState(x); return h('span', {class:'pill ' + (st === 'Paid' ? 'ok' : st === 'Overdue' ? 'bad' : st === 'Due soon' ? 'warn' : 'grey')}, st); }
function contentPill(s){ return h('span', {class:'pill ' + (s === 'Posted' ? 'ok' : s === 'Scheduled' ? 'blue' : s === 'Designed' ? 'blue' : 'grey')}, s); }
function approvalPill(s){ return h('span', {class:'pill ' + (s === 'Approved' ? 'ok' : s === 'Changes requested' ? 'warn' : s === 'Waiting for client' ? 'blue' : 'grey')}, s || 'Not sent yet'); }

/* ---------- tabs ---------- */
function renderTabs(){
  var nav = document.getElementById('tabs'); nav.textContent = '';
  var counts = {
    leads: S.leads.filter(leadDue).length,
    payments: S.payments.filter(function(x){ return payState(x) === 'Overdue'; }).length,
    content: S.content.filter(function(c){ return c.status !== 'Posted' && daysFrom(c.date) === 0; }).length,
    website: S.requests.filter(function(r){ return r.status !== 'Done'; }).length,
    docs: S.invoices.filter(function(v){ return v.status !== 'Paid' && v.due && daysFrom(v.due) < 0; }).length
  };
  TABS.forEach(function(t){
    var c = counts[t[0]];
    nav.appendChild(h('button', {class:'tab', role:'tab', 'aria-selected': tab === t[0] ? 'true' : 'false', on:{click:function(){ setTab(t[0]); }}},
      t[1], c ? h('span', {class:'count' + (t[0] !== 'website' ? ' hot' : '')}, c) : null));
  });
}

/* ---------- overview ---------- */
function viewOverview(){
  var t = today(), target = S.settings.outreachTarget || 10, n = outreachOn(t);
  var days = []; for (var i = 6; i >= 0; i--) days.push(addDays(t, -i));
  var maxV = Math.max(target, Math.max.apply(null, days.map(outreachOn)));
  var weekTotal = days.reduce(function(s, d){ return s + outreachOn(d); }, 0);

  var slots = S.settings.foundingSlots || 5, used = Math.min(slots, foundingUsed());
  var dots = []; for (var j = 0; j < slots; j++) dots.push(h('i', {class: j < used ? 'taken' : ''}));
  var outreach = h('div', {class:'panel outreach'},
    h('div', {class:'eyebrow'}, 'Outreach today'),
    h('div', {class:'or-main'},
      h('div', {class:'or-num num', 'aria-live':'polite'}, h('b', null, n), h('small', null, ' / ' + target)),
      h('div', {class:'or-btns'},
        h('button', {class:'or-btn', 'aria-label':'Remove one message', on:{click:function(){ bumpOutreach(-1); }}}, '−'),
        h('button', {class:'or-btn plus', 'aria-label':'Add one message sent', on:{click:function(){ bumpOutreach(1); }}}, '+'))),
    h('div', {class:'or-line'}, h('i', {style:'width:' + Math.min(100, n / target * 100) + '%'})),
    h('div', {class:'week', 'aria-label':'Messages sent in the last 7 days'}, days.map(function(d){
      var v = outreachOn(d);
      return h('div', {class:'bar' + (v >= target ? ' hit' : '') + (d === t ? ' today' : ''), style:'height:' + Math.max(4, v / maxV * 100) + '%', title: fmtDate(d) + ': ' + v});
    })),
    h('div', {class:'week-labels'}, days.map(function(d){ return h('span', null, DOW[parse(d).getDay()].slice(0,2)); })),
    h('div', {class:'or-note'}, weekTotal + ' personal messages in the last 7 days. Tap + after each one you send.'),
    h('div', {class:'founding'}, h('div', null, h('div', {class:'eyebrow'}, 'Founding spots'), h('div', {class:'f-left'}, (slots - used) + ' of ' + slots + ' left · ' + (S.settings.foundingDiscount || 20) + '% off')),
      h('div', {class:'dots', 'aria-label': used + ' of ' + slots + ' founding spots taken'}, dots)));

  var openLeads = S.leads.filter(function(l){ return OPEN.indexOf(l.status) >= 0; });
  var pipeline = openLeads.reduce(function(s, l){ return s + (Number(l.value) || 0); }, 0);
  var month = t.slice(0, 7);
  var collected = S.payments.reduce(function(s, x){ return s + (x.paidOn && x.paidOn.slice(0,7) === month ? Number(x.amount) || 0 : 0); }, 0);
  var unpaid = S.payments.filter(function(x){ return !x.paidOn; });
  var outstanding = unpaid.reduce(function(s, x){ return s + (Number(x.amount) || 0); }, 0);
  var overdue = unpaid.filter(function(x){ return payState(x) === 'Overdue'; });

  var kpis = h('div', {class:'kpis'},
    h('div', {class:'kpi'}, h('div', {class:'eyebrow'}, 'Open leads'), h('div', {class:'v'}, openLeads.length), h('div', {class:'s'}, S.leads.filter(leadDue).length + ' follow-ups due')),
    h('div', {class:'kpi'}, h('div', {class:'eyebrow'}, 'Pipeline'), h('div', {class:'v'}, money(pipeline)), h('div', {class:'s'}, 'Estimated value of open leads')),
    h('div', {class:'kpi'}, h('div', {class:'eyebrow'}, 'Collected · ' + MON[new Date().getMonth()]), h('div', {class:'v'}, money(collected)), h('div', {class:'s'}, 'Payments marked paid this month')),
    h('div', {class:'kpi' + (overdue.length ? ' alert' : '')}, h('div', {class:'eyebrow'}, 'Outstanding'), h('div', {class:'v'}, money(outstanding)), h('div', {class:'s'}, overdue.length ? overdue.length + ' overdue' : unpaid.length + ' payment' + (unpaid.length === 1 ? '' : 's') + ' not paid yet')),
    null);

  var right = h('div', {style:'display:flex;flex-direction:column;gap:16px;min-width:0'}, kpis, funnelPanel());

  // attention lists
  var follow = S.leads.filter(leadDue).sort(function(a,b){ return a.nextFollowUp < b.nextFollowUp ? -1 : 1; }).slice(0, 6);
  var followPanel = h('div', {class:'panel'},
    h('div', {class:'panel-head'}, h('h2', null, 'Follow up today'), h('button', {class:'linkish', on:{click:function(){ leadFilter = 'Follow up'; setTab('leads'); }}}, 'All leads')),
    follow.length ? h('div', {class:'list'}, follow.map(function(l){
      return h('div', {class:'item'},
        h('div', {class:'main'}, h('div', {class:'t'}, l.name), h('div', {class:'sub'}, [l.business, l.channel, l.contact].filter(Boolean).join(' · '))),
        h('div', {class:'right'}, h('div', {class:daysFrom(l.nextFollowUp) < 0 ? 'due' : 'soon'}, rel(l.nextFollowUp))),
        h('button', {class:'btn small', on:{click:function(){ markContacted(l); }}}, 'Done'));
    })) : h('div', {class:'empty'}, S.leads.length ? 'No follow-ups due. Add new people to reach today.' : h('span', null, 'No leads yet. Add the first person you message in ', h('b', null, 'Leads'), '.')));

  var payDue = unpaid.slice().sort(function(a,b){ return (a.due || '9') < (b.due || '9') ? -1 : 1; }).slice(0, 5);
  var payPanel = h('div', {class:'panel'},
    h('div', {class:'panel-head'}, h('h2', null, 'Money coming in'), h('button', {class:'linkish', on:{click:function(){ setTab('payments'); }}}, 'All payments')),
    payDue.length ? h('div', {class:'list'}, payDue.map(function(x){
      return h('div', {class:'item'},
        h('div', {class:'main'}, h('div', {class:'t'}, payClient(x)), h('div', {class:'sub'}, (x.label || 'Payment') + ' · ' + rel(x.due))),
        h('div', {class:'right num'}, money(x.amount)), payPill(x));
    })) : h('div', {class:'empty'}, 'Nothing waiting. When you add a project, its payment plan appears here.'));

  var upcoming = S.content.filter(function(c){ return c.status !== 'Posted' && daysFrom(c.date) >= -3; }).sort(function(a,b){ return a.date < b.date ? -1 : 1; }).slice(0, 5);
  var contentPanel = h('div', {class:'panel'},
    h('div', {class:'panel-head'}, h('h2', null, 'Next on Instagram'), h('button', {class:'linkish', on:{click:function(){ setTab('content'); }}}, 'Calendar')),

function connErr(e, server){

  if (c === 'needs_reauth') return s + ' needs reconnecting. Open claude.ai Settings → Connectors and reconnect it.';
  if (c === 'server_not_connected' || c === 'selection_required' || c === 'server_not_found') return 'Connect ' + s + ' in claude.ai Settings → Connectors to edit the website from here.';
  if (c === 'not_in_manifest' || c === 'approval_required' || c === 'consent_required') return 'Allow ' + s + ' for this dashboard, then press Try again.';
  if (c === 'not_granted' && window.claude && window.claude.demo) return 'Public demo: in production this tab edits the live website through the Google Sheets and Google Drive APIs (text, photos, packages, newsletter). That connection is turned off here.';
  if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'Website editing isn’t available in this view. Open CodeLine HQ from claude.ai or the desktop app.';
  if (c === 'no_folder') return 'Image uploads need a public folder. Run setup() once in Apps Script (see the install steps), then press Reload.';
  if (c === 'bad_image') return 'That file isn’t an image we can read. Use a JPG or PNG.';
  if (c === 'tool_error') return s + ' refused the change: ' + (e.message || 'unknown error');
  return 'Couldn’t reach ' + s + '. Check your connection and try again.';
}
function sheetCall(tool, input){

/* images: shrink in the browser, upload to the public Drive folder, use the public link */
function compressImage(file, maxSide){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var s = Math.min(1, maxSide / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.84).split(',')[1]);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej({code:'bad_image'}); };
    img.src = url;
  });
}
function uploadImage(file){
  var folder = siteValue('_imagesFolderId');

  if (!mcp) return Promise.reject({code:'not_granted'});

    var name = 'site-' + today() + '-' + file.name.replace(/\.[^.]+$/, '').replace(/[^\w-]+/g, '-').slice(0, 40) + '.jpg';
    return mcp.callTool(DRIVE, 'create_file', {title: name, base64Content: b64, contentMimeType: 'image/jpeg', parentId: folder, disableConversionToGoogleType: true}, {cache:false});
  }).then(function(r){
    var p = r.payload || {}, id = p.id || p.fileId || (p.file && p.file.id);
    if (!id){ var m = JSON.stringify(p).match(/"id"\s*:\s*"([\w-]{20,})"/); id = m && m[1]; }
    if (!id) throw {code:'tool_error', message:'Drive did not return the new file.'};
    return 'https://lh3.googleusercontent.com/d/' + id;
  });
}

var pdfLib = null;

    .catch(function(){ return loadScript('https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'); })
    .then(function(){ if (!window.html2pdf) throw {code:'lib'}; return window.html2pdf; }, function(){ pdfLib = null; throw {code:'lib'}; });

function exportPdf(el, filename, btn){

        })))) : h('div', {class:'empty'}, h('b', null, 'No invoices yet. '), 'Press “New invoice”, pick a project, and the client, amounts and due date fill in from its payment plan.')),
    h('div', {class:'site-grid'},

/* ---------- drawer / forms ---------- */
function closeDrawer(){ document.getElementById('layer').textContent = ''; document.removeEventListener('keydown', escClose); }
function escClose(e){ if (e.key === 'Escape') closeDrawer(); }
function drawer(title, fields, values, opts){
  opts = opts || {};
  var layer = document.getElementById('layer'); layer.textContent = '';
  var err = h('div', {class:'err', role:'alert'});
  var inputs = {};
  var form = h('form', {class:'form', novalidate:true});
  fields.forEach(function(f){
    var id = 'f-' + f.key, v = values[f.key], input;
    if (f.type === 'select'){
      input = h('select', {id:id}, (f.blank ? [h('option', {value:''}, f.blank)] : []).concat(f.options.map(function(o){
        var val = typeof o === 'string' ? o : o.value, lab = typeof o === 'string' ? o : o.label;
        return h('option', {value:val, selected: String(v == null ? '' : v) === String(val)}, lab);
      })));
    } else if (f.type === 'textarea') { input = h('textarea', {id:id}); input.value = v || ''; }
    else if (f.type === 'checkbox') { input = h('input', {id:id, type:'checkbox', checked: !!v}); }
    else { input = h('input', {id:id, type:f.type || 'text', value: v == null ? '' : v, step: f.type === 'number' ? 'any' : null, min: f.min, placeholder: f.placeholder || null}); }
    inputs[f.key] = input;
    if (f.onChange) input.addEventListener('change', function(){ f.onChange(inputs); });
    form.appendChild(f.type === 'checkbox'
      ? h('div', {class:'field checkbox full'}, input, h('label', {for:id}, f.label))
      : h('div', {class:'field' + (f.full ? ' full' : '')}, h('label', {for:id}, f.label + (f.required ? ' *' : '')), input, f.hint ? h('div', {class:'hint'}, f.hint) : null));
  });
  function collect(){
    var out = {};
    fields.forEach(function(f){
      var el = inputs[f.key];
      out[f.key] = f.type === 'checkbox' ? el.checked : f.type === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value.trim();
    });
    return out;
  }
  var saveBtn = h('button', {class:'btn primary', type:'submit'}, opts.saveLabel || 'Save');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var data = collect();
    var missing = fields.filter(function(f){ return f.required && (data[f.key] === '' || data[f.key] == null); });
    if (missing.length){ err.textContent = 'Fill in ' + missing.map(function(f){ return f.label; }).join(', ') + '.'; inputs[missing[0].key].focus(); return; }
    saveBtn.disabled = true;
    Promise.resolve(opts.onSave(data)).then(function(){ closeDrawer(); }).catch(function(e){ saveBtn.disabled = false; if (!e || e.code !== 'handled') fail(e); });
  });
  var foot = h('div', {class:'drawer-foot'});
  if (opts.onDelete){
    var del = h('button', {class:'btn danger', type:'button'}, 'Delete');
    del.addEventListener('click', function(){
      if (!del.classList.contains('armed')){ del.classList.add('armed'); del.textContent = 'Confirm delete'; setTimeout(function(){ del.classList.remove('armed'); del.textContent = 'Delete'; }, 3500); return; }
      Promise.resolve(opts.onDelete()).then(closeDrawer).catch(function(e){ if (e && /needs_reauth|server_not_connected|not_in_manifest|tool_error|server_unavailable|upstream_error/.test(e.code)) toast(connErr(e)); else fail(e); });
    });
    foot.appendChild(del);
  }
  foot.appendChild(h('span', {class:'spacer'}));
  foot.appendChild(h('button', {class:'btn ghost', type:'button', on:{click:closeDrawer}}, 'Cancel'));
  foot.appendChild(saveBtn);
  saveBtn.setAttribute('form', 'drawer-form'); form.id = 'drawer-form';
  var panel = h('div', {class:'drawer', role:'dialog', 'aria-modal':'true', 'aria-label':title},
    h('div', {class:'drawer-head'}, h('h2', {style:'font-size:19px'}, title), h('button', {class:'btn small ghost', 'aria-label':'Close', on:{click:closeDrawer}}, '×')),
    opts.actions ? h('div', {class:'drawer-actions'}, opts.actions) : null, opts.top || null, form, err, opts.extra || null, foot);
  var scrim = h('div', {class:'scrim', on:{click:function(e){ if (e.target === scrim) closeDrawer(); }}}, panel);
  layer.appendChild(scrim);
  document.addEventListener('keydown', escClose);
  var first = panel.querySelector('input:not([type=checkbox]),select,textarea'); if (first) first.focus();
  return inputs;
}

var PKG_NAMES = function(){ return (S.settings.packages || []).map(function(p){ return p.name; }); };

function openLead(l){
  var isNew = !l; l = l || {status:'New', nextFollowUp: today()};
  var top = null;
  if (!isNew && l.status === 'Won' && !l.projectId){
    top = h('div', {class:'callout'}, h('div', null, h('b', null, 'This lead said yes. '), 'Start the project to set the price, deadline and payment plan.'),
      h('div', null, h('button', {class:'btn primary small', type:'button', on:{click:function(){ closeDrawer(); openProject(null, l); }}}, 'Start project')));
  } else if (!isNew && l.lastContact){
    top = h('div', {class:'muted', style:'font-size:13px'}, 'Last contacted ' + fmtDate(l.lastContact) + (l.created ? ' · Added ' + fmtDate(l.created.slice(0,10)) : ''));
  }
  drawer(isNew ? 'New lead' : l.name, [
    {key:'name', label:'Name', required:true},
    {key:'business', label:'Business'},
    {key:'contact', label:'Contact', placeholder:'@handle, phone or email', full:true},
    {key:'channel', label:'Found / reached on', type:'select', options:CHANNELS, blank:'Choose…'},
    {key:'type', label:'Client type', type:'select', options:CLIENT_TYPES, blank:'Choose…'},
    {key:'status', label:'Status', type:'select', options:LEAD_STATUSES},
    {key:'package', label:'Interested in', type:'select', options:PKG_NAMES().concat(['Not sure yet']), blank:'Choose…',
      onChange:function(inp){ var p = pkg(inp.package.value); if (p && !inp.value.value) inp.value.value = p.price; }},
    {key:'value', label:'Estimated value ($)', type:'number', min:0},
    {key:'nextFollowUp', label:'Next follow-up', type:'date'},
    {key:'notes', label:'Notes', type:'textarea', full:true, placeholder:'What they need, what you sent, audit video link…'}
  ], l, {
    top: top,
    actions: isNew ? null : [h('button', {class:'btn small', type:'button', on:{click:function(){ openLeadPdf(Object.assign({}, l)); }}}, 'Proposal PDF for client')],
    saveLabel: isNew ? 'Add lead' : 'Save',
    onSave: function(d){
      d.updated = new Date().toISOString();
      if (isNew){ d.created = d.updated; if (d.status !== 'New') d.lastContact = today(); return create('leads', d).then(function(){ toast('Lead added'); }); }
      var wonNow = d.status === 'Won' && l.status !== 'Won' && !l.projectId;
      return save('leads', l.id, d, true).then(function(){ if (wonNow){ toast('Marked as won'); setTimeout(function(){ openProject(null, Object.assign({}, l, d)); }, 50); } else toast('Saved'); });
    },
    onDelete: isNew ? null : function(){ return remove('leads', l.id); }
  });
}

function planFor(total, start, deadline){
  var parts = total > 1500 ? [[0.4,'Deposit (40%)'],[0.4,'Design approved (40%)'],[0.2,'Launch (20%)']] : [[0.5,'Deposit (50%)'],[0.5,'Launch (50%)']];
  var mid = start && deadline ? addDays(start, Math.round((parse(deadline) - parse(start)) / 86400000 / 2)) : deadline;
  var dues = parts.length === 3 ? [start, mid, deadline] : [start, deadline];
  var acc = 0;
  return parts.map(function(p, i){
    var amt = i === parts.length - 1 ? round2(total - acc) : round2(total * p[0]); acc += amt;
    return {label:p[1], amount:amt, due:dues[i]};
  });
}

function openProject(p, fromLead){
  var isNew = !p;
  if (isNew){
    var pk = pkg(fromLead && fromLead.package) || pkg('Digital ID');
    var used = foundingUsed() < (S.settings.foundingSlots || 5);
    p = {client: fromLead ? (fromLead.business || fromLead.name) : '', package: pk.name, price: (fromLead && fromLead.value) || pk.price, founding: used, stage:'Discovery', approval:'Not sent yet',
         start: today(), deadline: addDays(today(), (pk.weeks || 4) * 7), revisionsUsed:0, leadId: fromLead ? fromLead.id : null};
  }
  var extra = null;
  if (!isNew){
    var pays = paymentsFor(p.id);
    extra = h('div', null, h('div', {class:'eyebrow', style:'margin-bottom:6px'}, 'Payments'),
      pays.length ? h('table', {class:'mini-table'}, h('tbody', null, pays.sort(function(a,b){ return (a.due||'') < (b.due||'') ? -1 : 1; }).map(function(x){
        return h('tr', null, h('td', null, x.label), h('td', {class:'muted'}, x.paidOn ? 'Paid ' + fmtDate(x.paidOn) : rel(x.due)), h('td', {class:'num'}, money(x.amount)));
      }))) : h('div', {class:'muted', style:'font-size:13px'}, 'No payments linked.'));
  }
  var summary = h('div', {class:'callout'});
  function refresh(inp){
    var total = inp.founding.checked ? round2((Number(inp.price.value) || 0) * (1 - (S.settings.foundingDiscount || 20) / 100)) : (Number(inp.price.value) || 0);
    summary.textContent = '';
    add(summary, h('div', null, h('b', null, 'Client pays ' + money(total)), inp.founding.checked ? ' after the founding discount' : ''));
    if (isNew) add(summary, h('div', {class:'muted'}, 'Payment plan: ' + planFor(total, inp.start.value || today(), inp.deadline.value).map(function(x){ return money(x.amount) + (x.due ? ' on ' + fmtDate(x.due, false) : ''); }).join(' · ')));
  }
  var inputs = drawer(isNew ? 'New project' : p.client, [
    {key:'client', label:'Client / business', required:true, full:true},
    {key:'package', label:'Package', type:'select', options:PKG_NAMES(), onChange:function(inp){ var k = pkg(inp.package.value); if (k){ inp.price.value = k.price; if (isNew) inp.deadline.value = addDays(inp.start.value || today(), (k.weeks || 4) * 7); } refresh(inp); }},
    {key:'price', label:'Package price ($)', type:'number', min:0, required:true, onChange:refresh},
    {key:'founding', label:'Founding client (' + (S.settings.foundingDiscount || 20) + '% off, ' + Math.max(0, (S.settings.foundingSlots || 5) - foundingUsed()) + ' spots left)', type:'checkbox', onChange:refresh},
    {key:'stage', label:'Step', type:'select', options:STAGES.concat(['Done'])},
    {key:'approval', label:'Client approval', type:'select', options:APPROVALS},
    {key:'start', label:'Start date', type:'date', onChange:refresh},
    {key:'deadline', label:'Deadline', type:'date', onChange:refresh},
    {key:'revisionsUsed', label:'Revision rounds used', type:'number', min:0, hint:'2 are included; extra rounds are $99 each.'},
    {key:'notes', label:'Notes', type:'textarea', full:true, placeholder:'Brief, links to files, approval notes…'}
  ], p, {
    top: summary, extra: extra, saveLabel: isNew ? 'Create project + payment plan' : 'Save',
    actions: isNew ? null : [h('button', {class:'btn small', type:'button', on:{click:function(){ openProjectPdf(p); }}}, 'Project PDF for client'), h('button', {class:'btn small', type:'button', on:{click:function(){ closeDrawer(); openInvoice(null, p); }}}, 'New invoice')],
    onSave: function(d){
      d.updated = new Date().toISOString();
      if (!isNew) return save('projects', p.id, d, true).then(function(){ toast('Saved'); });
      d.created = d.updated; d.leadId = p.leadId || null;
      var ref = db ? db.collection('projects').doc() : null;
      if (!ref) return Promise.reject({code:'unavailable'});
      var total = d.founding ? round2((Number(d.price) || 0) * (1 - (S.settings.foundingDiscount || 20) / 100)) : Number(d.price) || 0;
      var k = pkg(d.package);
      var plan = k && k.monthly ? [{label: d.package + ' · first month', amount: total, due: d.start || today()}] : planFor(total, d.start || today(), d.deadline);
      return ref.set(d).then(function(){
        return Promise.all(plan.map(function(x){ return create('payments', {projectId: ref.id, label: x.label, amount: x.amount, due: x.due || '', paidOn: '', created: d.created}, true); }));
      }).then(function(){
        if (p.leadId) return save('leads', p.leadId, {projectId: ref.id, status:'Won'}, true);
      }).then(function(){ toast('Project created with ' + plan.length + ' payment' + (plan.length > 1 ? 's' : '')); });
    },
    onDelete: isNew ? null : function(){
      return Promise.all(paymentsFor(p.id).filter(function(x){ return !x.paidOn; }).map(function(x){ return remove('payments', x.id, true); })).then(function(){ return remove('projects', p.id); });
    }
  });
  refresh(inputs);
}

function openPayment(x){

  drawer(isNew ? 'New payment' : (x.label || 'Payment'), [

function selectCaption(){ var el = document.getElementById('f-caption'); if (el){ el.focus(); el.select(); toast('Caption selected. Copy it with your keyboard.'); } }

/* ---------- store ---------- */
function create(col, data, quiet){ if (!db) return Promise.reject({code:'unavailable'}); return db.collection(col).add(data).catch(function(e){ if (!quiet) fail(e); throw e; }); }
function save(col, id, patch, merge){ if (!db){ fail({code:'unavailable'}); return Promise.reject({code:'unavailable'}); } var ref = db.doc(col + '/' + id); return (merge ? ref.update(patch) : ref.set(patch)).catch(function(e){ fail(e); throw e; }); }
function remove(col, id, quiet){ if (!db) return Promise.reject({code:'unavailable'}); return db.doc(col + '/' + id).delete().then(function(){ if (!quiet) toast('Deleted'); }).catch(function(e){ fail(e); throw e; }); }
function bumpOutreach(delta){
  var t = today(), n = Math.max(0, outreachOn(t) + delta);
  S.outreach[t] = {date:t, count:n}; render();
  if (db) db.doc('outreach/' + t).set({date:t, count:n}).catch(fail);
  if (delta > 0 && n === (S.settings.outreachTarget || 10)) toast('Daily target hit. Good work.');
}

function setSync(state, text){ var s = document.getElementById('sync'); s.className = 'sync ' + state; document.getElementById('sync-text').textContent = text; }

var renderQueued = false, pendingRender = false;
document.addEventListener('focusout', function(){ if (pendingRender){ pendingRender = false; setTimeout(queueRender, 0); } });
function render(){
  renderTabs();
  var v = document.getElementById('view'); v.textContent = '';
  var fn = {overview:viewOverview, leads:viewLeads, projects:viewProjects, payments:viewPayments, content:viewContent, website:viewWebsite, docs:viewDocs}[tab] || viewOverview;
  add(v, fn());
}
function queueRender(){
  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(function(){ renderQueued = false;
    var active = document.activeElement;
    var view = document.getElementById('view');
    if (active && view.contains(active) && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName) && (active.value || active.id.indexOf('cms-') === 0)){ renderTabs(); pendingRender = true; return; }
    render();
  });
}

function boot(){
  prepLogo();
  var hash = (location.hash || '').replace('#', '');
  if (TABS.some(function(t){ return t[0] === hash; })) tab = hash;
  render();
  if (!window.claude || !window.claude.use){ mcpResolved = true; setSync('off', 'Offline'); document.getElementById('offline').hidden = false; return; }
  window.claude.use('db').then(function(d){
    if (!d){ setSync('off', 'Not saving'); document.getElementById('offline').hidden = false; return; }
    db = d; setSync('live', 'Synced');
    ['leads','projects','payments','content','requests','checklist','invoices','letters'].forEach(function(col){
      db.collection(col).onSnapshot(function(snap){
        S[col] = snap.docs.map(function(doc){ return Object.assign({id: doc.id}, doc.data()); });
        setSync('live', 'Synced'); queueRender();
      }, function(e){ console.error(col, e); setSync('off', 'Sync stopped · reload'); });
    });
    db.collection('outreach').orderBy('date', 'desc').limit(60).onSnapshot(function(snap){
      var o = {}; snap.docs.forEach(function(doc){ var x = doc.data(); o[x.date || doc.id] = x; }); S.outreach = o; queueRender();
    }, function(e){ console.error('outreach', e); });
    db.doc('settings/main').onSnapshot(function(doc){
      settingsExists = doc.exists; S.settings = doc.exists ? Object.assign({}, DEFAULT_SETTINGS, doc.data()) : DEFAULT_SETTINGS; queueRender();
    }, function(e){ console.error('settings', e); });
  }).catch(function(e){ console.error(e); setSync('off', 'Not saving'); document.getElementById('offline').hidden = false; });
  window.claude.use('mcp').then(function(m){ mcp = m; mcpResolved = true; if (tab === 'website') queueRender(); }, function(){ mcpResolved = true; if (tab === 'website') queueRender(); });
  window.claude.use('downloads').then(function(dl){ downloads = dl; }, function(){});
}
boot();
if (window.claude && window.claude.demo){ var b = document.getElementById('demo-banner'); if (b) b.style.display = ''; }
})();
</script>
